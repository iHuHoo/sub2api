name: Build Aox Image

on:
  push:
    tags:
      - 'v*-aox.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Aox version without the leading v'
        required: true
        default: '0.1.165-aox.0.0.1'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-aox-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Resolve image metadata
        id: metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-aox\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match the Aox version policy: x.y.z-aox.A.B.C" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.image }}:v${{ steps.metadata.outputs.version }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            BUILD_TYPE=aox
            COMMIT=${{ github.sha }}

      - name: Publish candidate summary
        shell: bash
        run: |
          {
            echo "## Aox candidate image"
            echo
            echo "- Image: \`${{ steps.metadata.outputs.image }}:v${{ steps.metadata.outputs.version }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Source commit: \`${{ github.sha }}\`"
            echo
            echo "Production deployment is manual."
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    # Only a tag ref has a tag to release; a branch dispatch builds an image without one.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tools
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/release-tools

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: .github/release-tools/aox-release.sh "${GITHUB_REF_NAME}" "${{ needs.build.outputs.image }}" "${{ needs.build.outputs.digest }}"
